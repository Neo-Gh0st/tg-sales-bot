name: Bot
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u bot.py
        env:
          SALES_TOKEN: ${{ secrets.SALES_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
